  <!-- Row 2 -->
  <text x="58" y="138" font-family="monospace" font-size="11" fill="#C9A84C" opacity="0.7">🤝</text>
  <text x="78" y="138" font-family="monospace" font-size="11" fill="#8B6914" letter-spacing="1">COLLABORATE</text>
