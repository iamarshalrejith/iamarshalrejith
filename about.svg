  <text x="190" y="168" font-family="monospace" font-size="11" fill="#C8C0A8">DSA · System Design · AI Integrations</text>

  <!-- Row 4 -->
  <text x="58" y="198" font-family="monospace" font-size="11" fill="#C9A84C" opacity="0.7">💬</text>
