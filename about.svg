  <text x="58" y="228" font-family="monospace" font-size="11" fill="#C9A84C" opacity="0.7">🎯</text>
  <text x="78" y="228" font-family="monospace" font-size="11" fill="#8B6914" letter-spacing="1">FOCUS</text>
  <text x="190" y="228" font-family="monospace" font-size="11" fill="#C8C0A8">Clean code · Scalable systems · Ship fast</text>

  <!-- Row 6 -->
  <text x="58" y="258" font-family="monospace" font-size="11" fill="#C9A84C" opacity="0.7">⚡</text>
  <text x="78" y="258" font-family="monospace" font-size="11" fill="#8B6914" letter-spacing="1">FUN FACT</text>
  <text x="190" y="258" font-family="monospace" font-size="11" fill="#C8C0A8">I love turning ideas into real products 🚀</text>

  <!-- Separator line between cols -->
