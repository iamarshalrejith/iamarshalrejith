  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="12" fill="url(#bg)"/>

  <!-- Gold border top -->
  <rect x="0" y="0" width="800" height="3" rx="2" fill="url(#gold)"/>

  <!-- Left gold accent bar -->
  <rect x="0" y="0" width="3" height="320" rx="2" fill="url(#goldV)"/>

  <!-- Corner ornaments -->
  <text x="18" y="26" font-family="serif" font-size="16" fill="#C9A84C" opacity="0.6">◈</text>
  <text x="766" y="26" font-family="serif" font-size="16" fill="#C9A84C" opacity="0.6">◈</text>
  <text x="18" y="312" font-family="serif" font-size="16" fill="#C9A84C" opacity="0.6">◈</text>
  <text x="766" y="312" font-family="serif" font-size="16" fill="#C9A84C" opacity="0.6">◈</text>

