  <text x="780" y="220" text-anchor="end" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#C9A84C" opacity="0.6">✦</text>

  <text x="400" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#8B6B30" font-style="italic">✦   Turning ideas into real-world products   ✦</text>

