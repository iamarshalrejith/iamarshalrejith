  <text x="400" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#3A3020" letter-spacing="0.5">"Code is craft — a reflection of how precisely you can think."</text>
  <text x="400" y="508" text-anchor="middle" font-family="Georgia, serif" font-size="8" letter-spacing="3" fill="#2A2010" opacity="0.7">· · ◈ · ·</text>
