  <!-- Row 4 -->
  <text x="58" y="384" font-family="monospace" font-size="11" fill="#C9A84C">💬</text>
  <text x="78" y="384" font-family="monospace" font-size="11" fill="#C9A84C" letter-spacing="1">ASK ME ABOUT</text>
