  <rect x="0" y="0" width="800" height="3" fill="url(#gold)"/>
  <rect x="0" y="517" width="800" height="3" fill="url(#gold)"/>
  <rect x="0" y="0" width="3" height="520" fill="url(#goldV)"/>
  <rect x="797" y="0" width="3" height="520" fill="url(#goldV)"/>

