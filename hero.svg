  <!-- Row 5 -->
  <text x="58" y="414" font-family="monospace" font-size="11" fill="#C9A84C">🎯</text>
  <text x="78" y="414" font-family="monospace" font-size="11" fill="#C9A84C" letter-spacing="1">FOCUS</text>
  <text x="210" y="414" font-family="monospace" font-size="11" fill="#C8C0A8">Clean code · Scalable systems · Ship fast</text>

